; LILYGO LoRa32 — Acuario: pez que avanza por el fondo del mar y se cruza
; con otros animales. Solo usa el OLED.
;
; Por defecto LoRa32 V2.1 (T3 V1.6.x). Para la V1.0 usa el entorno "acuario_v1".

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@2.36.2

[env:acuario]
board = ttgo-lora32-v21
build_flags = -DBOARD_LORA32_V21

[env:acuario_v1]
board = ttgo-lora32-v1
build_flags = -DBOARD_LORA32_V1
