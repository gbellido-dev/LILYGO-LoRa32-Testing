; LILYGO LoRa32 — proyecto padre
;
; Agrupa los proyectos (Testing, Bridge, Alfabeto y Acuario) para poder compilarlos y
; grabarlos desde la raíz del repositorio. Cada carpeta sigue siendo un
; proyecto PlatformIO independiente; este fichero solo apunta a sus fuentes.
;
;   testing_home / testing_garage : barridos de SF (ver Testing/README.md)
;   bridge_home  / bridge_garage  : sensores -> Home Assistant (ver Bridge/README.md)
;   alfabeto                      : letra gigante cada 3 s en el OLED (ver Alfabeto/README.md)
;   acuario                       : pez animado en el fondo del mar (ver Acuario/README.md)
;
; Por defecto se compila para LoRa32 V2.1 (T3 V1.6.x). Si tu placa es la
; V1.0 usa los entornos *_v1 (cambian los pines de LoRa RST y del OLED).
;
;   pio run -e bridge_garage -t upload

[platformio]
src_dir = .

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
    olikraus/U8g2@2.36.2

; --- placa ---------------------------------------------------------------

[v21]
board = ttgo-lora32-v21
build_flags = -DBOARD_LORA32_V21

[v1]
board = ttgo-lora32-v1
build_flags = -DBOARD_LORA32_V1

; --- Testing -------------------------------------------------------------

[testing_home]
build_src_filter = +<Testing/src/common/> +<Testing/src/home/>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1

[testing_garage]
build_src_filter = +<Testing/src/common/> +<Testing/src/garage/>

[env:testing_home]
extends = v21, testing_home
build_flags = ${v21.build_flags} -I Testing/include

[env:testing_garage]
extends = v21, testing_garage
build_flags = ${v21.build_flags} -I Testing/include

[env:testing_home_v1]
extends = v1, testing_home
build_flags = ${v1.build_flags} -I Testing/include

[env:testing_garage_v1]
extends = v1, testing_garage
build_flags = ${v1.build_flags} -I Testing/include

; --- Bridge --------------------------------------------------------------

[bridge_home]
build_src_filter = +<Bridge/src/common/> +<Bridge/src/home/>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1

[bridge_garage]
build_src_filter = +<Bridge/src/common/> +<Bridge/src/garage/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@2.2.4

[env:bridge_home]
extends = v21, bridge_home
build_flags = ${v21.build_flags} -I Bridge/include

[env:bridge_garage]
extends = v21, bridge_garage
build_flags = ${v21.build_flags} -I Bridge/include

[env:bridge_home_v1]
extends = v1, bridge_home
build_flags = ${v1.build_flags} -I Bridge/include

[env:bridge_garage_v1]
extends = v1, bridge_garage
build_flags = ${v1.build_flags} -I Bridge/include

; --- Alfabeto ------------------------------------------------------------

[alfabeto]
build_src_filter = +<Alfabeto/src/>
lib_deps = olikraus/U8g2@2.36.2

[env:alfabeto]
extends = v21, alfabeto

[env:alfabeto_v1]
extends = v1, alfabeto

; --- Acuario -------------------------------------------------------------

[acuario]
build_src_filter = +<Acuario/src/>
lib_deps = olikraus/U8g2@2.36.2

[env:acuario]
extends = v21, acuario

[env:acuario_v1]
extends = v1, acuario
