; LILYGO LoRa32 — Alfabeto: muestra en el OLED una letra mayúscula cada 3 s,
; lo más grande posible.
;
; Por defecto LoRa32 V2.1 (T3 V1.6.x). Para la V1.0 usa el entorno "v1".

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@2.36.2

[env:alfabeto]
board = ttgo-lora32-v21
build_flags = -DBOARD_LORA32_V21

[env:alfabeto_v1]
board = ttgo-lora32-v1
build_flags = -DBOARD_LORA32_V1
