; LILYGO LoRa32 — Bridge: sensores del garaje -> LoRa -> Home Assistant
;
;   home   : nodo de casa (WiFi + MQTT + Home Assistant Discovery).
;   garage : nodo del garaje (solo alimentación) con PIR, puerta y BME280.
;
; Por defecto se compila para LoRa32 V2.1 (T3 V1.6.x). Si tu placa es la
; V1.0 usa los entornos *_v1 (cambian los pines de LoRa RST y del OLED).

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
    olikraus/U8g2@2.36.2
build_src_filter = +<common/>

[v21]
board = ttgo-lora32-v21
build_flags = -DBOARD_LORA32_V21

[v1]
board = ttgo-lora32-v1
build_flags = -DBOARD_LORA32_V1

[home_base]
build_src_filter = ${env.build_src_filter} +<home/>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1

[garage_base]
build_src_filter = ${env.build_src_filter} +<garage/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@2.2.4

[env:home]
extends = v21, home_base

[env:garage]
extends = v21, garage_base

[env:home_v1]
extends = v1, home_base

[env:garage_v1]
extends = v1, garage_base
